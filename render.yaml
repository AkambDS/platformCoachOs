services:
  # ── Django Backend API ─────────────────────────────────────────────────────
  - type: web
    name: backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "platformcoachos.onrender.com,.onrender.com,localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      # ── Email — Gmail SMTP (set these in Render dashboard) ──
      - key: EMAIL_HOST_USER
        value: CHANGE_ME@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: CHANGE_ME          # Gmail App Password (16 chars, no spaces)
      - key: DEFAULT_FROM_EMAIL
        value: "CoachOS <CHANGE_ME@gmail.com>"
      # ── App URLs ──
      - key: FRONTEND_URL
        value: "https://platformcoachos-1.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://platformcoachos.onrender.com,https://platformcoachos-1.onrender.com"
      # ── Stripe (set when ready) ──
      - key: STRIPE_TEST_SECRET_KEY
        value: ""
      - key: DJSTRIPE_WEBHOOK_SECRET
        value: ""
      # ── Cron secret (used by cron-job.org to call /api/internal/reminders/) ──
      - key: CRON_SECRET
        generateValue: true
      # ── Sentry (optional) ──
      - key: SENTRY_DSN
        value: ""

  # ── React Frontend (Static Site) ───────────────────────────────────────────
  - type: web
    env: static
    name: frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://platformcoachos.onrender.com"
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── Managed PostgreSQL ─────────────────────────────────────────────────────────
databases:
  - name: db
    databaseName: coachos
    user: coachos_user
    plan: free
    postgresMajorVersion: 16
