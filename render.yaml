services:
  # ── Django Backend API ─────────────────────────────────────────────────────
  - type: web
    name: backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile          # relative to rootDir
    dockerCommand: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:10000 --workers 3 --timeout 60"
    envVars:
      - key: PORT
        value: "10000"                    # Render requires 10000
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "platformcoachos.onrender.com,*.onrender.com,localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: redis
          type: pserv
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redis
          type: pserv
          property: connectionString
      - key: STRIPE_TEST_SECRET_KEY
        value: sk_test_CHANGE_ME
      - key: DJSTRIPE_WEBHOOK_SECRET
        value: whsec_CHANGE_ME
      - key: SENDGRID_API_KEY
        value: CHANGE_ME
      - key: AWS_STORAGE_BUCKET_NAME
        value: CHANGE_ME
      - key: AWS_ACCESS_KEY_ID
        value: CHANGE_ME
      - key: AWS_SECRET_ACCESS_KEY
        value: CHANGE_ME
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: SENTRY_DSN
        value: ""

  # ── Celery Worker ───────────────────────────────────────────────────────────
  - type: worker
    name: celery-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile          # reuses same backend Dockerfile
    dockerCommand: >
      celery -A config.celery worker
      --loglevel=info
      --concurrency=2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: backend
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: redis
          type: pserv
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redis
          type: pserv
          property: connectionString

  # ── Celery Beat ─────────────────────────────────────────────────────────────
  - type: worker
    name: celery-beat
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: >
      celery -A config.celery beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: backend
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: redis
          type: pserv
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redis
          type: pserv
          property: connectionString

  # ── React Frontend ─────────────────────────────────────────────────────────
  - type: static
    name: frontend
    rootDir: frontend                     # was missing before
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://platformcoachos.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html          # fixes React Router on refresh

  # ── Redis Private Service ───────────────────────────────────────────────────
  - type: pserv
    name: redis
    runtime: docker
    image:
      url: docker.io/library/redis:7-alpine
    dockerCommand: redis-server --appendonly yes

# ── Managed PostgreSQL ─────────────────────────────────────────────────────────
databases:
  - name: db
    databaseName: coachos
    user: coachos_user
    plan: free                            # changed from starter to free
    postgresSQLVersion: "16"