upstream backend {
    server backend:8000;
}

upstream onlyoffice {
    server onlyoffice:80;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/coachos.rass-consulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coachos.rass-consulting.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ──
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://coachos.rass-consulting.com:8443; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.stripe.com https://checkout.stripe.com wss: https://coachos.rass-consulting.com:8443 wss://coachos.rass-consulting.com:8443; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://coachos.rass-consulting.com:8443; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Django API ──
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # ── Django Admin ──
    location /django-admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Stripe webhook (direct to backend) ──
    location /stripe/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Session RSVP links (email confirm/cancel/reschedule) ──
    location /session/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── django-allauth (Google OAuth connect flow) ──
    location /accounts/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # allauth sets a session cookie during the OAuth dance — needs to survive the
        # redirect to Google and back, so no special cookie handling beyond the default.
    }

    # ── Invoice payment links (email "Pay Invoice" / client portal "Pay Now") ──
    # apps.invoicing.public_views.InvoicePayView / InvoicePaySuccessView are registered
    # at the Django root (/invoices/pay/<token>/), not under /api/ — without this block
    # they'd fall through to the React SPA catch-all below instead of reaching Django,
    # and every client payment link would silently 404 into the app shell.
    location /invoices/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Contract signing link (email "Review & Sign Online") ──
    location /contract/ {
        proxy_pass         http://backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # This page (apps.clients.public_views.ContractSignView) ships its own small,
        # static, self-authored inline <script> for the signature canvas — no third-party
        # or user-interpolated JS. The site-wide CSP below has no 'unsafe-inline' in
        # script-src, which silently blocks that script entirely (canvas never becomes
        # interactive, form submits with an empty signature, server rejects with 400).
        # add_header in a location block drops ALL inherited ones from the server block,
        # so the other four security headers are repeated here unchanged.
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "DENY"                            always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # ── Django static files ──
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Uploaded media ──
    location /media/ {
        alias /var/www/media/;
        expires 7d;
    }

    # ── React SPA (catch-all) ──
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "no-cache";
    }

    # Cache hashed JS/CSS assets aggressively
    location ~* \.(js|css)$ {
        root /var/www/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── OnlyOffice Document Server ──────────────────────────────────────────────
# Served on a distinct port on the SAME domain/cert (no extra DNS record or
# certbot run needed). OnlyOffice hardcodes root-relative asset paths, so it
# needs its own server block rather than a /path/ prefix off the main site —
# remember to open port 8443 in the EC2 security group.
server {
    listen 8443 ssl;
    server_name coachos.rass-consulting.com;

    ssl_certificate     /etc/letsencrypt/live/coachos.rass-consulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coachos.rass-consulting.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://onlyoffice;
        # $host strips the port from the incoming Host header — OnlyOffice then thinks
        # its own public address is the bare domain (no :8443) and generates cache/asset
        # URLs pointing at port 443 (the main app, a different origin), which the browser
        # then blocks as CORS. $http_host preserves the port exactly as the client sent it.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # OnlyOffice uses websockets for live co-editing/autosave state
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
