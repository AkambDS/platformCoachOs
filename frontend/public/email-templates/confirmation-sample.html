<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{workspace_name}</title>
</head>
<body style="margin:0;padding:0;background:#f0ede8;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
  <tr><td style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;">

      <!-- Header -->
      <tr>
        <td style="background:#1a2f4e;padding:24px 40px;border-radius:8px 8px 0 0;">
          <span style="font-family:Georgia,serif;font-size:22px;color:#f7f4ef;">{workspace_name}</span>
        </td>
      </tr>
      <tr><td style="height:3px;background:#b8922e;"></td></tr>

      <!-- Body -->
      <tr>
        <td style="background:#fff;padding:40px;border-radius:0 0 8px 8px;">
          <h1 style="margin:0 0 24px;font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:400;color:#16130f;line-height:1.3;">
            Your session is confirmed.
          </h1>
          <p style="margin:0 0 16px;font-size:15px;color:#3a3530;line-height:1.7;">
            Hi <strong>{client_name}</strong>,
          </p>
          <p style="margin:0 0 16px;font-size:15px;color:#3a3530;line-height:1.7;">
            Your <strong>{session_title}</strong> with {coach_name} has been confirmed. We look forward to seeing you!
          </p>

          <!-- Session details box -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 28px;border:1px solid #e8e4df;border-radius:6px;overflow:hidden;">
            <tr>
              <td style="padding:14px 20px;border-bottom:1px solid #e8e4df;background:#f9f7f5;">
                <span style="font-size:11px;font-weight:700;color:#8c7f74;letter-spacing:.08em;text-transform:uppercase;">When</span><br>
                <span style="font-size:15px;color:#16130f;font-weight:600;">{session_time}</span>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 20px;border-bottom:1px solid #e8e4df;background:#f9f7f5;">
                <span style="font-size:11px;font-weight:700;color:#8c7f74;letter-spacing:.08em;text-transform:uppercase;">Session</span><br>
                <span style="font-size:15px;color:#16130f;font-weight:600;">{session_title}</span>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 20px;background:#f9f7f5;">
                <span style="font-size:11px;font-weight:700;color:#8c7f74;letter-spacing:.08em;text-transform:uppercase;">Coach</span><br>
                <span style="font-size:15px;color:#16130f;font-weight:600;">{coach_name}</span>
              </td>
            </tr>
          </table>

          <p style="margin:0 0 4px;font-size:15px;color:#3a3530;">See you soon!</p>
          <p style="margin:0;font-size:15px;color:#3a3530;font-weight:600;">{workspace_name}</p>
        </td>
      </tr>

      <!-- Footer -->
      <tr>
        <td style="padding:20px;text-align:center;font-size:11px;color:#b5afa6;">
          Sent by {workspace_name}
        </td>
      </tr>

    </table>
  </td></tr>
</table>
</body>
</html>
