# stack and test suite run on. The Dockerfile installs requirements.txt WITH these as
# constraints, so a rebuild can never silently pull a newer release (2026-11-10:
# celery/kombu 5.7 arrived on rebuild and broke every background job).
# To upgrade: change requirements.txt, rebuild locally, run the tests, then regenerate:
#   docker compose exec -T api pip freeze | grep -vE '^(pip|setuptools|wheel)==' > backend/requirements.lock
